name: "[TEMPORAL] Diagnóstico cohesion_bloque desde runner real"

# Workflow descartable, SOLO para la Tarea 11 del plan de automatización de
# cohesion_bloque: confirmar si votaciones.hcdn.gob.ar bloquea también a los
# runners de GitHub Actions (ya sabemos que bloquea desde este sandbox de
# desarrollo, IP-level, per Tareas 4-10). Sin el environment "github-pages"
# del pipeline real (que gatea el job entero a ramas autorizadas) — corre
# libre en cualquier rama. Se borra después de leer el resultado.
on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/informe_coyuntura
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/informe_coyuntura/requirements.txt

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Probar fetch_cohesion_bloque contra el sitio real
        run: |
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          import politica

          s = politica._hcdn_votaciones_session()

          r_raw = s.post(f'{politica.HCDN_VOTACIONES_BASE}/votaciones/search', data={'anoSearch': '2026'}, timeout=politica.HTTP_TIMEOUT)
          print('RAW STATUS:', r_raw.status_code)
          print('RAW LEN:', len(r_raw.text))
          txt = r_raw.text
          txt_low = txt.lower()
          for marca in ['redirectacta', '<tr', 'acta', 'votac', 'sin resultado', 'no se encontr', 'recaptcha', 'captcha', 'iniciar sesion', 'iniciar sesión', 'login', 'onclick=']:
              print(f'OCURRENCIAS {marca!r}:', txt_low.count(marca))
          # buscar el bloque <body> para saltear head/css y ver contenido real
          i = txt_low.find('<body')
          print('SNIPPET DESDE <body> (2000 chars):', txt[i:i+2000] if i >= 0 else 'NO HAY <body>')

          actas = politica._descubrir_actas(s, 2026)
          print('N ACTAS 2026:', len(actas) if actas is not None else actas)
          if actas:
              print('MAS RECIENTE:', max(a[\"fecha\"] for a in actas))
              print('MAS VIEJA:', min(a[\"fecha\"] for a in actas))
              acta_reciente = max(actas, key=lambda a: a['fecha'])
              print('EJEMPLO ACTA:', acta_reciente)
              r = politica._hcdn_votaciones_get(s, politica._url_acta(acta_reciente))
              print('DETALLE HTTP STATUS:', r.status_code if r else 'sin respuesta')
              if r:
                  filas = politica._parsear_acta(r.text)
                  print('FILAS PARSEADAS:', len(filas))
                  print('EJEMPLO FILAS:', filas[:3])
                  lla = [f for f in filas if politica.es_bloque_lla(f['bloque'])]
                  print('FILAS LLA:', len(lla))

          resultado = politica.fetch_cohesion_bloque()
          print('RESULTADO fetch_cohesion_bloque():', resultado)
          "
