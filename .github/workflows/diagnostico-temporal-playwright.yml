name: "[TEMPORAL] Diagnóstico Playwright para votaciones.hcdn.gob.ar"

# Workflow descartable — confirma si un headless browser (Playwright/Chromium)
# ve contenido real donde requests+BeautifulSoup solo ve el shell de carga de
# la SPA (confirmado en la Tarea 11 del plan de cohesion_bloque). Se borra
# después de leer el resultado.
on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Screenshot + HTML completo de votaciones.hcdn.gob.ar
        run: |
          python3 -c "
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1400, 'height': 1000})
              try:
                  page.goto('https://votaciones.hcdn.gob.ar/', timeout=25000, wait_until='networkidle')
                  page.wait_for_timeout(2000)
                  page.screenshot(path='home.png', full_page=True)
                  with open('home.html', 'w', encoding='utf-8') as f:
                      f.write(page.content())
                  print('Screenshot y HTML de HOME guardados.')

                  # Intentar cerrar posibles modales 'Aceptar' antes de otra screenshot
                  for b in page.query_selector_all('button'):
                      texto = (b.inner_text() or '').strip().lower()
                      if texto == 'aceptar':
                          try:
                              b.click(timeout=2000)
                              page.wait_for_timeout(500)
                          except Exception:
                              pass
                  page.screenshot(path='home_post_aceptar.png', full_page=True)
                  with open('home_post_aceptar.html', 'w', encoding='utf-8') as f:
                      f.write(page.content())
                  print('Screenshot y HTML post-Aceptar guardados.')
              except Exception as e:
                  print('EXCEPTION:', type(e).__name__, str(e)[:500])
              browser.close()
          "
          echo "Archivos generados:"
          ls -la *.png *.html

      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-playwright
          path: |
            home.png
            home.html
            home_post_aceptar.png
            home_post_aceptar.html
          retention-days: 1
