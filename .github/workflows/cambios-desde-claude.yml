name: Cambios desde Claude

# Los PR que abre el conector de claude.ai (ramas `claude/…`) se mergean
# solos: corren los tests, los tipos y el build, y al terminar se mergea PASE
# LO QUE PASE (decisión de Juan del 6-oct-2026: «si no, no tiene gracia el
# conector»). Si algo falló, el PR lo comenta y la corrida nocturna lo avisa
# en #monitor-alertas. Si el build falla, Vercel deja en vivo la versión
# anterior; todo cambio se deshace desde claude.ai (monitor_deshacer_cambio).
#
# Lo único que frena el merge: tocar workflows, credenciales o los datos que
# genera la corrida (web/src/data/), que el conector tampoco deja pedir.
# Un cambio fuera de web/src/ (cálculo, umbrales, datos, ADRs) lanza además la
# corrida de datos, porque sin ella no llega a la web.
#
# La regla de los jobs: el que ejecuta código del repo (el del PR o el main
# recién mergeado) no tiene secretos ni permisos de escritura, y el que tiene
# token no ejecuta nada del cambio. `validar` corre el PR sin escribir nada;
# `publicar` mergea y avisa con el script de avisos tal como estaba en main
# ANTES del merge; `fichas` regenera las fichas sin secretos y `fichas-commit`
# las commitea sin ejecutar nada, después de validar que sólo son
# output/fichas/*.md. El conector deja editar cualquier archivo de scripts/: si
# un job con token corriera `scripts/...` del main nuevo, un pedido inducido
# podría leerse los secretos.
#
# Estado del pedido: un solo comentario por PR, `<!-- estado-pedido -->` +
# JSON, que se crea y se edita (merge, deploy del diario, corrida). Lo lee el
# conector de claude.ai; el contrato está en el CLAUDE.md del repo.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions: {}

concurrency:
  group: cambios-desde-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: projects/informe_coyuntura
    steps:
      # Historia completa: test_bigquery_backfill recorre las corridas en git.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/informe_coyuntura/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/informe_coyuntura/web/package-lock.json
      - run: npm ci
        working-directory: projects/informe_coyuntura/web
      - run: python scripts/fichas/generar.py --todos
      # El manual se regenera desde el código igual que las fichas: si no, todo
      # cambio de pesos sale con una prueba en rojo que no es de nadie (#75).
      - run: python scripts/manual_cinturon.py --todos
      - name: Tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          python -m pytest tests -q -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/logs/pytest.log"
      - name: Tipos
        if: ${{ !cancelled() }}
        working-directory: projects/informe_coyuntura/web
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/logs/tsc.log"
      - name: Build
        if: ${{ !cancelled() }}
        working-directory: projects/informe_coyuntura/web
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -40 | tee "$RUNNER_TEMP/logs/build.log"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  publicar:
    needs: validar
    # Se mergea con los tests en verde o en rojo; sólo no si la validación se
    # canceló, que es cuando llegó un commit nuevo y hay otra corrida en curso.
    if: ${{ !cancelled() && (needs.validar.result == 'success' || needs.validar.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Global, no por PR: dos pedidos seguidos leían y escribían a la vez el
    # artifact `estado-avisos-cambios` y el segundo pisaba al primero. Ojo: con
    # cancel-in-progress: false GitHub deja UN solo job esperando; si llega un
    # tercero mientras hay uno corriendo y otro esperando, cancela al que
    # esperaba. `cerrar-estado` lo deja escrito en su PR (merge=fallo).
    concurrency:
      group: cambios-desde-claude-publicar
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      metodo: ${{ steps.archivos.outputs.metodo }}
      hilo: ${{ steps.evaluar.outputs.hilo }}
      despacho: ${{ steps.corrida.outputs.despacho }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.sha }}
      REPO: ${{ github.repository }}
      TESTS: ${{ needs.validar.result }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CANAL_ALERTAS: ${{ secrets.SLACK_CANAL_ALERTAS }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # El script de avisos sale de main ANTES del merge (`$BASE`), nunca del
      # PR: este job tiene el token y no ejecuta nada que haya escrito el PR.
      - name: Preparar el aviso
        run: |
          mkdir -p "$RUNNER_TEMP/aviso"
          git show "$BASE:projects/informe_coyuntura/scripts/aviso_cambio_claude.py" > "$RUNNER_TEMP/aviso/aviso.py" \
            || echo "[aviso] main todavía no tiene el script: este cambio no avisa"
          gh pr view "$PR" --json title,url,body,files,additions,deletions > "$RUNNER_TEMP/aviso/pr.json"

      - name: Estado inicial en el PR
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/aviso/aviso.py" ] || exit 0
          python3 "$RUNNER_TEMP/aviso/aviso.py" estado --pr "$PR" --repo "$REPO" --merge pendiente

      - name: Archivos que tocó
        id: archivos
        run: |
          cambiados=$(git diff --name-only "$(git merge-base "$BASE" "$SHA")" "$SHA")
          frenar=$(echo "$cambiados" | grep -E '^\.github/|(^|/)\.env|^projects/informe_coyuntura/web/src/data/' || true)
          if [ -n "$frenar" ]; then
            printf 'No se publica: toca archivos que no se pueden cambiar desde una conversación.\n\n%s\n' "$(echo "$frenar" | sed 's/^/- /')" > "$RUNNER_TEMP/c.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/c.md"
            if [ -s "$RUNNER_TEMP/aviso/aviso.py" ]; then
              python3 "$RUNNER_TEMP/aviso/aviso.py" estado --pr "$PR" --repo "$REPO" --merge fallo \
                --motivo "bloqueado: toca archivos que no se pueden cambiar desde una conversación ($(echo "$frenar" | head -5 | paste -sd, -))" || true
            fi
            exit 1
          fi
          metodo=$(echo "$cambiados" | grep -vE '^projects/informe_coyuntura/(web/src/|output/fichas/)' | grep -v '^$' || true)
          [ -n "$metodo" ] && echo "metodo=si" >> "$GITHUB_OUTPUT" || echo "metodo=no" >> "$GITHUB_OUTPUT"

      # Con qué pruebas rojas quedó main después del último cambio, y los hilos
      # abiertos (ADR-0350). Va en un artifact y no en la cache: la cache de un
      # `pull_request` sólo la ve ese mismo PR, y esto lo tiene que leer el
      # siguiente. Lo escribe cada cambio al final y lo vacía la corrida
      # nocturna en verde. Sin artifact (el primero, o vencido a los 90 días)
      # el aviso culpa al cambio por todo, como antes.
      - name: Traer el estado de los avisos
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/estado-avisos"
          id=$(gh api "repos/$REPO/actions/artifacts?name=estado-avisos-cambios&per_page=30" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty') || id=""
          if [ -n "$id" ]; then
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/estado-avisos.zip" \
              && unzip -o -q "$RUNNER_TEMP/estado-avisos.zip" -d "$RUNNER_TEMP/estado-avisos"
          else
            echo "[aviso] no hay estado previo: se compara contra nada"
          fi

      # --match-head-commit: si alguien empujó otra cosa en el medio, el merge
      # falla en vez de publicar algo distinto de lo pedido. GitHub calcula si
      # un PR se puede mergear en diferido, así que se reintenta. Si no sale,
      # el motivo queda en el comentario de estado (merge=fallo).
      - name: Mergear
        id: mergear
        run: |
          for intento in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA" 2> "$RUNNER_TEMP/merge.err"; then
              [ -s "$RUNNER_TEMP/aviso/aviso.py" ] && python3 "$RUNNER_TEMP/aviso/aviso.py" estado --pr "$PR" --repo "$REPO" --merge ok --motivo "" || true
              exit 0
            fi
            cat "$RUNNER_TEMP/merge.err" >&2
            [ "$intento" = 6 ] && break
            sleep 10
          done
          error=$(tr '\n' ' ' < "$RUNNER_TEMP/merge.err" | cut -c1-300)
          [ -s "$RUNNER_TEMP/aviso/aviso.py" ] && python3 "$RUNNER_TEMP/aviso/aviso.py" estado --pr "$PR" --repo "$REPO" --merge fallo \
            --motivo "GitHub no dejó mergear después de 6 intentos: ${error:-sin detalle}" || true
          exit 1

      # El input `pedido` le pone el número del PR al nombre de la corrida
      # (run-name de data-pipeline.yml): así `seguir-corrida` encuentra ESTA
      # corrida y no la de otro pedido que se lanzó al mismo tiempo.
      - name: Corrida de datos si tocó el cálculo
        id: corrida
        if: steps.archivos.outputs.metodo == 'si'
        run: |
          aviso="$RUNNER_TEMP/aviso/aviso.py"
          if gh workflow run data-pipeline.yml --repo "$REPO" --ref main -f pedido="$PR"; then
            echo "despacho=ok" >> "$GITHUB_OUTPUT"
            [ -s "$aviso" ] && python3 "$aviso" estado --pr "$PR" --repo "$REPO" --corrida-estado en_curso \
              --corrida-url "${{ github.server_url }}/$REPO/actions/workflows/data-pipeline.yml" || true
          else
            echo "despacho=fallo" >> "$GITHUB_OUTPUT"
            [ -s "$aviso" ] || exit 0
            python3 "$aviso" estado --pr "$PR" --repo "$REPO" --corrida-estado no_despachada || true
            python3 "$aviso" corrida --pr "$PR" --datos-pr "$RUNNER_TEMP/aviso/pr.json" --conclusion "no se pudo lanzar" \
              --corrida-url "${{ github.server_url }}/$REPO/actions/workflows/data-pipeline.yml" || true
          fi

      - if: env.TESTS == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: logs
          path: logs
        continue-on-error: true

      # Los logs se leen como texto y se citan dentro de un bloque de código:
      # nada de lo que diga un test se ejecuta.
      - name: Avisar en el PR
        run: |
          {
            if [ "${{ steps.archivos.outputs.metodo }}" = si ]; then
              echo "✅ Publicado. Como toca el cálculo, se lanzó la corrida de datos: en unos 40 minutos se ve en el seguimiento diario (https://cigob-seguimiento-a941210feb.vercel.app/). El informe mensual (https://informe.cigob.org/) toma los datos nuevos recién en la próxima publicación del mes."
            else
              echo "✅ Publicado: en un par de minutos se ve en https://informe.cigob.org/ (el mensual se rearma con el código nuevo) y en el seguimiento diario."
            fi
            if [ "$TESTS" = failure ]; then
              echo
              echo "⚠️ Se publicó con pruebas en rojo. Si el sitio no compila, la web queda como estaba; si es otra cosa, la corrida nocturna lo va a avisar en Slack."
              for paso in pytest tsc build; do
                f="logs/$paso.log"
                [ -s "$f" ] || continue
                fallas=$(grep -E "^(FAILED|ERROR)|error TS|\[ERROR\]|AssertionError" "$f" | head -15)
                [ -n "$fallas" ] || continue
                echo; echo "**$paso**"; echo '```'
                echo "$fallas" | sed 's/```/ʼʼʼ/g'
                echo '```'
              done
            fi
          } > comentario.md
          gh pr comment "$PR" --body-file comentario.md

      # Slack: pruebas en rojo, cálculo/bandas/cards tocados o un cambio grande.
      - name: Avisar en Slack
        id: evaluar
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/aviso/aviso.py" ] || exit 0
          python3 "$RUNNER_TEMP/aviso/aviso.py" evaluar --pr "$PR" --datos-pr "$RUNNER_TEMP/aviso/pr.json" \
            --pruebas "$TESTS" --logs logs --archivo-estado "$RUNNER_TEMP/estado-avisos/estado.json"

      # Espera el deploy de Vercel del SEGUIMIENTO DIARIO (cada commit tiene dos
      # status de Vercel: el del mensual y el del diario) y abre esa página.
      # informe.cigob.org es la foto del mes (ADR-0347): no verifica un pedido.
      # Avisa si el deploy falló, no terminó en 10 minutos o la página no carga.
      # Si el status dice que fue el tope diario de deploys del plan (7-oct-2026:
      # «Deployment rate limited — retry in 24 hours»), no es una falla del
      # cambio: 🟡 aparte, uno por tope (ADR-0350). Por eso se pasa también la
      # descripción del status y su hora.
      - name: Seguir el deploy
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/aviso/aviso.py" ] || exit 0
          merge=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
          vercel='[.statuses[]|select((.context|test("Vercel")) and (.context|test("cigob-seguimiento")))][0]'
          estado=""
          for _ in $(seq 1 40); do
            gh api "repos/$REPO/commits/$merge/status" > "$RUNNER_TEMP/status.json" \
              || echo '{"statuses":[]}' > "$RUNNER_TEMP/status.json"
            estado=$(jq -r "$vercel.state // \"\"" "$RUNNER_TEMP/status.json")
            [ "$estado" = success ] || [ "$estado" = failure ] || [ "$estado" = error ] && break
            sleep 15
          done
          descripcion=$(jq -r "$vercel.description // \"\"" "$RUNNER_TEMP/status.json")
          fecha=$(jq -r "$vercel.updated_at // \"\"" "$RUNNER_TEMP/status.json")
          http=$(curl -s -o /dev/null -w "%{http_code}" "https://cigob-seguimiento-a941210feb.vercel.app/?cb=$RANDOM" || echo "")
          python3 "$RUNNER_TEMP/aviso/aviso.py" estado --pr "$PR" --repo "$REPO" \
            --estado "$estado" --descripcion "$descripcion" --http "$http" || true
          python3 "$RUNNER_TEMP/aviso/aviso.py" deploy --pr "$PR" --datos-pr "$RUNNER_TEMP/aviso/pr.json" \
            --hilo "${{ steps.evaluar.outputs.hilo }}" --estado "$estado" --http "$http" \
            --descripcion "$descripcion" --fecha-status "$fecha" \
            --archivo-estado "$RUNNER_TEMP/estado-avisos/estado.json"

      # Siempre: el siguiente cambio compara contra esto. Si el job se cortó
      # antes de evaluar, se vuelve a subir el mismo estado que se trajo.
      - name: Guardar el estado de los avisos
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: estado-avisos-cambios
          path: ${{ runner.temp }}/estado-avisos/estado.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Guardar el aviso para seguir la corrida
        if: steps.corrida.outputs.despacho == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: aviso
          path: ${{ runner.temp }}/aviso

  # Si `publicar` se canceló (otro pedido lo desplazó de la cola, o a mano),
  # el comentario de estado no puede quedar en «pendiente» para siempre. El
  # script sale de main ANTES del merge, como en `publicar`.
  cerrar-estado:
    needs: publicar
    if: ${{ always() && needs.publicar.result == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: projects/informe_coyuntura/scripts/aviso_cambio_claude.py
          sparse-checkout-cone-mode: false
      - run: |
          python3 projects/informe_coyuntura/scripts/aviso_cambio_claude.py estado \
            --pr "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --merge-si-pendiente fallo \
            --motivo "la publicación se canceló antes de mergear (otro pedido en la cola o se canceló a mano): volver a correr «Cambios desde Claude» en este PR"

  # Las fichas en markdown se regeneran después y directo a main, como las
  # sube el cron. Esto EJECUTA código del main recién mergeado, que pudo
  # escribir el pedido: por eso este job no tiene secretos ni permiso de
  # escritura, y sólo sube las fichas como artifact. Si falla, la corrida
  # nocturna las regenera igual.
  fichas:
    needs: publicar
    if: ${{ !cancelled() && needs.publicar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base: ${{ steps.generar.outputs.base }}
    defaults:
      run:
        working-directory: projects/informe_coyuntura
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Regenerar las fichas
        id: generar
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/fichas/generar.py --todos > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: fichas
          path: projects/informe_coyuntura/output/fichas/*.md
          if-no-files-found: error
          retention-days: 3

  # Commitea las fichas sin ejecutar nada del repo: sólo git. Acepta archivos
  # `.md` sueltos (sin carpetas ni enlaces) y aborta si el commit tocaría algo
  # fuera de output/fichas/*.md. Commitea sobre el MISMO commit desde el que se
  # generaron y empuja sin rebase: si main se movió en el medio, no se pisa
  # nada con fichas de otro estado (las regenera la nocturna).
  fichas-commit:
    needs: fichas
    if: ${{ !cancelled() && needs.fichas.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.fichas.outputs.base }}
      - uses: actions/download-artifact@v4
        with:
          name: fichas
          path: ${{ runner.temp }}/fichas
      - name: Validar y commitear
        env:
          PR: ${{ github.event.pull_request.number }}
          DIR: ${{ runner.temp }}/fichas
        run: |
          raros=$(find "$DIR" -mindepth 1 \( -type l -o -type d -o ! -name '*.md' \) -print)
          if [ -n "$raros" ]; then
            echo "::error::el artifact de fichas trae algo que no es un .md suelto: $raros"; exit 1
          fi
          for f in "$DIR"/*.md; do
            n=$(basename "$f")
            echo "$n" | grep -qE '^[A-Za-z0-9_.-]+\.md$' || { echo "::error::nombre inválido: $n"; exit 1; }
            cp "$f" "projects/informe_coyuntura/output/fichas/$n"
          done
          cambios=$(git status --porcelain --untracked-files=all)
          [ -n "$cambios" ] || { echo "Fichas al día: nada que commitear."; exit 0; }
          fuera=$(echo "$cambios" | cut -c4- | grep -vE '^projects/informe_coyuntura/output/fichas/[A-Za-z0-9_.-]+\.md$' || true)
          if [ -n "$fuera" ]; then
            echo "::error::el commit tocaría archivos fuera de output/fichas: $fuera"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add projects/informe_coyuntura/output/fichas/*.md
          git commit -q -m "fichas: regeneradas tras el #$PR"
          git -c core.hooksPath=/dev/null push -q origin HEAD:refs/heads/main \
            || echo "::notice::main se movió mientras se generaban las fichas: las regenera la corrida nocturna"

  # La corrida de datos que lanzó un cambio de cálculo: se la sigue hasta que
  # termina y deja el resultado en el comentario de estado del PR (y en Slack,
  # si no salió bien). El seguimiento corta solo a los 80 minutos, antes que el
  # job (90): así el paso final siempre llega a escribir el estado.
  seguir-corrida:
    needs: publicar
    if: ${{ !cancelled() && needs.publicar.outputs.metodo == 'si' && needs.publicar.outputs.despacho == 'ok' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CANAL_ALERTAS: ${{ secrets.SLACK_CANAL_ALERTAS }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aviso
          path: aviso
      - name: Esperar la corrida y avisar si falla
        run: |
          [ -s aviso/aviso.py ] || exit 0
          res="$RUNNER_TEMP/corrida.env"
          titulo="Corrida de datos del pedido $PR"
          fin=$(( $(date +%s) + 80 * 60 ))
          id=""
          for _ in $(seq 1 20); do
            id=$(gh run list --repo "$REPO" --workflow data-pipeline.yml --event workflow_dispatch --limit 30 \
                   --json databaseId,displayTitle \
                   --jq "[.[]|select(.displayTitle == \"$titulo\")]|first|.databaseId // empty") || id=""
            [ -n "$id" ] && break
            sleep 15
          done
          if [ -z "$id" ]; then
            echo "estado=no_despachada" > "$res"
            python3 aviso/aviso.py corrida --pr "$PR" --datos-pr aviso/pr.json --hilo "${{ needs.publicar.outputs.hilo }}" \
              --conclusion "no arrancó" --corrida-url "${{ github.server_url }}/$REPO/actions/workflows/data-pipeline.yml"
            exit 0
          fi
          url="${{ github.server_url }}/$REPO/actions/runs/$id"
          printf 'estado=en_curso\nurl=%s\n' "$url" > "$res"
          python3 aviso/aviso.py estado --pr "$PR" --repo "$REPO" --corrida-estado en_curso --corrida-url "$url" || true
          while :; do
            gh run view "$id" --repo "$REPO" --json status,conclusion,createdAt > "$RUNNER_TEMP/run.json" || true
            [ "$(jq -r '.status // ""' "$RUNNER_TEMP/run.json")" = completed ] && break
            if [ "$(date +%s)" -ge "$fin" ]; then
              printf 'estado=timeout\nurl=%s\n' "$url" > "$res"
              echo "::warning::la corrida sigue después de 80 minutos: se deja de seguir (timeout)"
              exit 0
            fi
            sleep 30
          done
          conclusion=$(jq -r '.conclusion // ""' "$RUNNER_TEMP/run.json")
          creada=$(jq -r '.createdAt // ""' "$RUNNER_TEMP/run.json")
          # Lo que dejó la corrida, del estado y no del log: el paso de commit
          # del job y el generated_at del snapshot que quedó en main.
          gh api "repos/$REPO/actions/runs/$id/jobs" > "$RUNNER_TEMP/jobs.json" || echo '{}' > "$RUNNER_TEMP/jobs.json"
          generado=$(gh api -H "Accept: application/vnd.github.raw" \
                       "repos/$REPO/contents/projects/informe_coyuntura/web/src/data/informe.json?ref=main" \
                       | jq -r '.generated_at // ""' 2>/dev/null) || generado=""
          snapshot=$(python3 aviso/aviso.py snapshot --jobs "$RUNNER_TEMP/jobs.json" \
                       --generated-at "$generado" --corrida-creada "$creada")
          case "$conclusion" in
            success) estado=ok ;;
            cancelled) estado=cancelada ;;
            timed_out) estado=timeout ;;
            *) estado=fallo ;;
          esac
          printf 'estado=%s\nurl=%s\nsnapshot=%s\ngenerado=%s\n' "$estado" "$url" "$snapshot" "$generado" > "$res"
          python3 aviso/aviso.py corrida --pr "$PR" --datos-pr aviso/pr.json --hilo "${{ needs.publicar.outputs.hilo }}" \
            --conclusion "$conclusion" --corrida-url "$url" --snapshot "$snapshot"

      # Siempre, también si el job se canceló o llegó a su timeout: el
      # comentario de estado no puede quedar en «en_curso» para siempre.
      - name: Estado final de la corrida
        if: always()
        continue-on-error: true
        run: |
          [ -s aviso/aviso.py ] || exit 0
          res="$RUNNER_TEMP/corrida.env"
          estado=""; url=""; snapshot=desconocido; generado=""
          if [ -s "$res" ]; then
            estado=$(sed -n 's/^estado=//p' "$res"); url=$(sed -n 's/^url=//p' "$res")
            snapshot=$(sed -n 's/^snapshot=//p' "$res"); generado=$(sed -n 's/^generado=//p' "$res")
          fi
          # Si el paso no llegó a dejar un estado terminal, se dejó de seguir.
          case "$estado" in
            ok|fallo|cancelada|timeout|no_despachada) ;;
            *) estado=timeout ;;
          esac
          python3 aviso/aviso.py estado --pr "$PR" --repo "$REPO" --corrida-estado "$estado" \
            ${url:+--corrida-url "$url"} --snapshot "${snapshot:-desconocido}" ${generado:+--generated-at "$generado"}
