name: Cambios desde Claude

# Los PR que abre el conector de claude.ai (ramas `claude/…`). Antes de esto,
# los tests sólo corrían en la corrida nocturna: un texto que rompiera una
# guarda —una sigla, un rótulo faltante— entraba a main y se descubría a las
# 3 de la mañana, con la corrida caída y la web congelada.
#
# Dos etiquetas, puestas por el conector según qué archivos toca el cambio:
#   · `texto`  — web/src/: si todo pasa, se mergea solo. Nadie lo aprueba.
#   · `metodo` — scripts, config, datos, ADRs, tests: espera a Juan. Al
#     mergearlo se lanza la corrida de datos, porque un umbral o un peso nuevo
#     no se ve hasta que se regenera el snapshot.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: cambios-desde-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/informe_coyuntura
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/informe_coyuntura/requirements.txt
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/informe_coyuntura/web/package-lock.json
      - run: npm ci
        working-directory: projects/informe_coyuntura/web

      # Las fichas en markdown salen de fichas.ts y del snapshot; un test exige
      # que estén al día. Se regeneran acá para que un cambio de texto en una
      # ficha no falle por un archivo que nadie le pidió a Luis que tocara.
      - name: Fichas generadas al día
        run: |
          python scripts/fichas/generar.py --todos
          if [ -n "$(git status --porcelain output/fichas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add output/fichas
            git commit -m "fichas: regeneradas desde el cambio de texto"
            git push
          fi

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          python -m pytest tests -q -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Tipos
        id: tipos
        working-directory: projects/informe_coyuntura/web
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/tsc.log"

      - name: Build
        id: build
        working-directory: projects/informe_coyuntura/web
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -40 | tee "$RUNNER_TEMP/build.log"

      - name: Mergear si es texto
        if: contains(github.event.pull_request.labels.*.name, 'texto')
        run: |
          gh pr comment "$PR" --body "✅ Pasaron los tests, los tipos y el build. Se publica solo: en un par de minutos se ve en https://informe.cigob.org/"
          gh pr merge "$PR" --squash --delete-branch

      - name: Avisar que el método espera aprobación
        if: contains(github.event.pull_request.labels.*.name, 'metodo')
        run: |
          gh pr comment "$PR" --body "✅ Pasaron los tests, los tipos y el build. Es un cambio de método: espera la aprobación de Juan. Al mergearlo se lanza la corrida de datos."

      - name: Explicar qué falló
        if: failure()
        run: |
          {
            echo "❌ El cambio no se publicó: la web sigue como estaba."
            echo
            for paso in pytest tsc build; do
              f="$RUNNER_TEMP/$paso.log"
              [ -s "$f" ] || continue
              fallas=$(grep -E "^(FAILED|ERROR)|error TS|\[ERROR\]|AssertionError" "$f" | head -15)
              [ -n "$fallas" ] || continue
              echo "**$paso**"
              echo '```'
              echo "$fallas"
              echo '```'
            done
            echo
            echo "Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/comentario.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comentario.md"

  corrida-tras-metodo:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      contains(github.event.pull_request.labels.*.name, 'metodo')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Lanzar la corrida de datos
        run: |
          gh workflow run data-pipeline.yml --repo "${{ github.repository }}" --ref main
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --body "Mergeado. Lancé la corrida de datos para que el cambio de método llegue a la web (tarda ~40 minutos)."
