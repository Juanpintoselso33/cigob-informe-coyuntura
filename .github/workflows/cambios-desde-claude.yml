name: Cambios desde Claude

# Los PR que abre el conector de claude.ai (ramas `claude/…`). Antes de esto,
# los tests sólo corrían en la corrida nocturna: un texto que rompiera una
# guarda —una sigla, un rótulo faltante— entraba a main y se descubría a las
# 3 de la mañana, con la corrida caída y la web congelada.
#
# Dos etiquetas, puestas por el conector según qué archivos toca el cambio:
#   · `texto`  — todo lo de la web (web/src/, salvo los datos generados):
#     si todo pasa, se mergea solo. Nadie lo aprueba. Ampliado el 6-oct-2026.
#   · `metodo` — scripts, config, datos, ADRs y tests: espera a Juan. Al mergearlo se lanza la corrida de datos, porque un
#     umbral o un peso nuevo no se ve hasta que se regenera el snapshot.
#
# Por qué jobs separados y no uno: hasta los archivos de texto son código que
# el build ejecuta (fichas.ts, datos.ts, un .astro). Si validar y mergear
# compartieran máquina, ese código podría dejarle algo envenenado al paso que
# tiene el token —un `gh` falso en $GITHUB_PATH, un hook de git— y mergear lo
# que quisiera. Así que `validar` corre el código del PR SIN ningún permiso de
# escritura, y `publicar` arranca en una máquina limpia, no ejecuta nada del
# PR salvo leerlo como texto, y mergea sólo el commit exacto que pasó.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  pull_request_target:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: cambios-desde-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: projects/informe_coyuntura
    outputs:
      sha: ${{ github.event.pull_request.head.sha }}
    steps:
      # Historia completa: test_bigquery_backfill recorre las corridas en git
      # y se niega a pasar sobre un checkout superficial.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/informe_coyuntura/requirements.txt
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/informe_coyuntura/web/package-lock.json
      - run: npm ci
        working-directory: projects/informe_coyuntura/web

      # Las fichas en markdown salen de fichas.ts y del snapshot, y un test
      # exige que estén al día. Se regeneran acá sólo para probar; las sube
      # `publicar`, que es el único que puede escribir.
      - run: python scripts/fichas/generar.py --todos

      - name: Tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          python -m pytest tests -q -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/logs/pytest.log"

      - name: Tipos
        working-directory: projects/informe_coyuntura/web
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/logs/tsc.log"

      - name: Build
        working-directory: projects/informe_coyuntura/web
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -40 | tee "$RUNNER_TEMP/logs/build.log"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  publicar:
    needs: validar
    if: >-
      contains(github.event.pull_request.labels.*.name, 'texto') &&
      !contains(github.event.pull_request.labels.*.name, 'metodo')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ needs.validar.outputs.sha }}
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validar.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Segunda llave: la etiqueta la pone el conector, pero el merge sólo
      # ocurre si de verdad todos los archivos son de la web. Espeja esTexto()
      # de cigob-landing/src/lib/monitor-reglas.ts; si cambia allá, se cambia
      # acá. Se mira el diff del commit validado, no el del PR de ahora.
      - name: Sólo textos
        run: |
          cambiados=$(git diff --name-only "$(git merge-base "$BASE" "$SHA")" "$SHA")
          fuera=$( { echo "$cambiados" | grep -vE '^projects/informe_coyuntura/(web/src/|output/fichas/[^/]+\.md$)' ; echo "$cambiados" | grep -E '^projects/informe_coyuntura/web/src/data/|/\.' ; } | sort -u | grep -v '^$' || true)
          if [ -n "$fuera" ]; then
            gh pr edit "$PR" --remove-label texto --add-label metodo
            printf 'Tiene la etiqueta de texto pero toca archivos que no son textos, así que no se publica solo: queda esperando a Juan.\n\n%s\n' "$(echo "$fuera" | sed 's/^/- /')" > "$RUNNER_TEMP/c.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/c.md"
            exit 1
          fi

      # --match-head-commit: si alguien empujó otra cosa después de los
      # tests, el merge falla en vez de publicar algo que nadie probó. GitHub
      # calcula si un PR se puede mergear en diferido, así que se reintenta.
      - name: Mergear
        run: |
          for intento in 1 2 3 4 5 6; do
            gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA" && break
            [ "$intento" = 6 ] && exit 1
            sleep 10
          done
          gh pr comment "$PR" --body "✅ Pasaron los tests, los tipos y el build. Publicado: en un par de minutos se ve en https://informe.cigob.org/"

      # Las fichas en markdown van DESPUÉS y directo a main, como las sube el
      # cron: empujarlas a la rama del PR disparaba otra corrida y cambiaba la
      # cabeza que se había validado. Con la lista verificada, scripts/ es el
      # de main, así que correr generar.py acá no ejecuta nada del PR.
      - name: Fichas al día en main
        working-directory: projects/informe_coyuntura
        run: |
          git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
          git checkout -q FETCH_HEAD
          python3 scripts/fichas/generar.py --todos > /dev/null
          [ -n "$(git status --porcelain output/fichas)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add output/fichas
          git commit -q -m "fichas: regeneradas tras el #$PR"
          for intento in 1 2 3; do
            git -c core.hooksPath=/dev/null push -q \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/main && exit 0
            git -c core.hooksPath=/dev/null pull -q --rebase \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
          done
          exit 1

  avisar:
    needs: validar
    if: >-
      always() && github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/') &&
      (needs.validar.result == 'failure' ||
       (needs.validar.result == 'success' && contains(github.event.pull_request.labels.*.name, 'metodo')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - if: needs.validar.result == 'success'
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "✅ Pasaron los tests, los tipos y el build. Es un cambio de método: espera la aprobación de Juan. Al mergearlo se lanza la corrida de datos."

      - if: needs.validar.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: logs
          path: logs
        continue-on-error: true

      # Los logs se leen como texto y se citan dentro de un bloque de código:
      # nada de lo que diga un test se ejecuta.
      - if: needs.validar.result == 'failure'
        run: |
          {
            echo "❌ El cambio no se publicó: la web sigue como estaba."
            echo
            for paso in pytest tsc build; do
              f="logs/$paso.log"
              [ -s "$f" ] || continue
              fallas=$(grep -E "^(FAILED|ERROR)|error TS|\[ERROR\]|AssertionError" "$f" | head -15)
              [ -n "$fallas" ] || continue
              echo "**$paso**"
              echo '```'
              echo "$fallas" | sed 's/```/ʼʼʼ/g'
              echo '```'
            done
            echo
            echo "Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > comentario.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comentario.md

  corrida-tras-metodo:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      contains(github.event.pull_request.labels.*.name, 'metodo')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Lanzar la corrida de datos
        run: |
          gh workflow run data-pipeline.yml --repo "${{ github.repository }}" --ref main
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --body "Mergeado. Lancé la corrida de datos para que el cambio de método llegue a la web (tarda ~40 minutos)."
