name: Cambios desde Claude

# Los PR que abre el conector de claude.ai (ramas `claude/…`) se mergean
# solos: corren los tests, los tipos y el build, y al terminar se mergea PASE
# LO QUE PASE (decisión de Juan del 6-oct-2026: «si no, no tiene gracia el
# conector»). Si algo falló, el PR lo comenta y la corrida nocturna lo avisa
# en #monitor-alertas. Si el build falla, Vercel deja en vivo la versión
# anterior; todo cambio se deshace desde claude.ai (monitor_deshacer_cambio).
#
# Lo único que frena el merge: tocar workflows, credenciales o los datos que
# genera la corrida (web/src/data/), que el conector tampoco deja pedir.
# Un cambio fuera de web/src/ (cálculo, umbrales, datos, ADRs) lanza además la
# corrida de datos, porque sin ella no llega a la web.
#
# Dos jobs y no uno: `validar` ejecuta código del PR (el build corre hasta
# fichas.ts) y por eso no tiene ningún permiso de escritura; `publicar`
# arranca en otra máquina, no ejecuta nada del PR y es el único con token.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions: {}

concurrency:
  group: cambios-desde-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: projects/informe_coyuntura
    steps:
      # Historia completa: test_bigquery_backfill recorre las corridas en git.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/informe_coyuntura/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/informe_coyuntura/web/package-lock.json
      - run: npm ci
        working-directory: projects/informe_coyuntura/web
      - run: python scripts/fichas/generar.py --todos
      - name: Tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          python -m pytest tests -q -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/logs/pytest.log"
      - name: Tipos
        if: ${{ !cancelled() }}
        working-directory: projects/informe_coyuntura/web
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/logs/tsc.log"
      - name: Build
        if: ${{ !cancelled() }}
        working-directory: projects/informe_coyuntura/web
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -40 | tee "$RUNNER_TEMP/logs/build.log"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  publicar:
    needs: validar
    # Se mergea con los tests en verde o en rojo; sólo no si la validación se
    # canceló, que es cuando llegó un commit nuevo y hay otra corrida en curso.
    if: ${{ !cancelled() && (needs.validar.result == 'success' || needs.validar.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      metodo: ${{ steps.archivos.outputs.metodo }}
      hilo: ${{ steps.evaluar.outputs.hilo }}
      despacho: ${{ steps.corrida.outputs.despacho }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.sha }}
      TESTS: ${{ needs.validar.result }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CANAL_ALERTAS: ${{ secrets.SLACK_CANAL_ALERTAS }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Archivos que tocó
        id: archivos
        run: |
          cambiados=$(git diff --name-only "$(git merge-base "$BASE" "$SHA")" "$SHA")
          frenar=$(echo "$cambiados" | grep -E '^\.github/|(^|/)\.env|^projects/informe_coyuntura/web/src/data/' || true)
          if [ -n "$frenar" ]; then
            printf 'No se publica: toca archivos que no se pueden cambiar desde una conversación.\n\n%s\n' "$(echo "$frenar" | sed 's/^/- /')" > "$RUNNER_TEMP/c.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/c.md"
            exit 1
          fi
          metodo=$(echo "$cambiados" | grep -vE '^projects/informe_coyuntura/(web/src/|output/fichas/)' | grep -v '^$' || true)
          [ -n "$metodo" ] && echo "metodo=si" >> "$GITHUB_OUTPUT" || echo "metodo=no" >> "$GITHUB_OUTPUT"

      # El script de avisos sale de main ANTES del merge (`$BASE`), nunca del
      # PR: este job tiene el token y no ejecuta nada que haya escrito el PR.
      - name: Preparar el aviso
        run: |
          mkdir -p "$RUNNER_TEMP/aviso"
          git show "$BASE:projects/informe_coyuntura/scripts/aviso_cambio_claude.py" > "$RUNNER_TEMP/aviso/aviso.py" \
            || echo "[aviso] main todavía no tiene el script: este cambio no avisa"
          gh pr view "$PR" --json title,url,body,files,additions,deletions > "$RUNNER_TEMP/aviso/pr.json"

      # --match-head-commit: si alguien empujó otra cosa en el medio, el merge
      # falla en vez de publicar algo distinto de lo pedido. GitHub calcula si
      # un PR se puede mergear en diferido, así que se reintenta.
      - name: Mergear
        run: |
          for intento in 1 2 3 4 5 6; do
            gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA" && break
            [ "$intento" = 6 ] && exit 1
            sleep 10
          done

      - name: Corrida de datos si tocó el cálculo
        id: corrida
        if: steps.archivos.outputs.metodo == 'si'
        run: |
          echo "despacho=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run data-pipeline.yml --repo "${{ github.repository }}" --ref main

      - if: env.TESTS == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: logs
          path: logs
        continue-on-error: true

      # Los logs se leen como texto y se citan dentro de un bloque de código:
      # nada de lo que diga un test se ejecuta.
      - name: Avisar en el PR
        run: |
          {
            if [ "${{ steps.archivos.outputs.metodo }}" = si ]; then
              echo "✅ Publicado. Como toca el cálculo, se lanzó la corrida de datos: en unos 40 minutos se ve en el seguimiento diario (https://cigob-seguimiento-a941210feb.vercel.app/). El informe mensual (https://informe.cigob.org/) toma los datos nuevos recién en la próxima publicación del mes."
            else
              echo "✅ Publicado: en un par de minutos se ve en https://informe.cigob.org/ (el mensual se rearma con el código nuevo) y en el seguimiento diario."
            fi
            if [ "$TESTS" = failure ]; then
              echo
              echo "⚠️ Se publicó con pruebas en rojo. Si el sitio no compila, la web queda como estaba; si es otra cosa, la corrida nocturna lo va a avisar en Slack."
              for paso in pytest tsc build; do
                f="logs/$paso.log"
                [ -s "$f" ] || continue
                fallas=$(grep -E "^(FAILED|ERROR)|error TS|\[ERROR\]|AssertionError" "$f" | head -15)
                [ -n "$fallas" ] || continue
                echo; echo "**$paso**"; echo '```'
                echo "$fallas" | sed 's/```/ʼʼʼ/g'
                echo '```'
              done
            fi
          } > comentario.md
          gh pr comment "$PR" --body-file comentario.md

      # Slack: pruebas en rojo, cálculo/bandas/cards tocados o un cambio grande.
      - name: Avisar en Slack
        id: evaluar
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/aviso/aviso.py" ] || exit 0
          python3 "$RUNNER_TEMP/aviso/aviso.py" evaluar --pr "$PR" --datos-pr "$RUNNER_TEMP/aviso/pr.json" \
            --pruebas "$TESTS" --logs logs

      # Espera el deploy de Vercel del merge y abre la página. Avisa si el
      # deploy falló, no terminó en 10 minutos o la página no carga.
      - name: Seguir el deploy
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/aviso/aviso.py" ] || exit 0
          merge=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
          estado=""
          for i in $(seq 1 40); do
            estado=$(gh api "repos/${{ github.repository }}/commits/$merge/status" \
              --jq '[.statuses[]|select(.context|test("Vercel"))][0].state // ""')
            [ "$estado" = success ] || [ "$estado" = failure ] || [ "$estado" = error ] && break
            sleep 15
          done
          http=$(curl -s -o /dev/null -w "%{http_code}" "https://informe.cigob.org/?cb=$RANDOM" || echo "")
          python3 "$RUNNER_TEMP/aviso/aviso.py" deploy --pr "$PR" --datos-pr "$RUNNER_TEMP/aviso/pr.json" \
            --hilo "${{ steps.evaluar.outputs.hilo }}" --estado "$estado" --http "$http"

      - name: Guardar el aviso para seguir la corrida
        if: steps.archivos.outputs.metodo == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: aviso
          path: ${{ runner.temp }}/aviso

      # Las fichas en markdown se regeneran después y directo a main, como las
      # sube el cron. Si falla, la corrida nocturna las regenera igual.
      - name: Fichas al día en main
        continue-on-error: true
        working-directory: projects/informe_coyuntura
        run: |
          git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
          git checkout -q FETCH_HEAD
          python3 scripts/fichas/generar.py --todos > /dev/null
          [ -n "$(git status --porcelain output/fichas)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add output/fichas
          git commit -q -m "fichas: regeneradas tras el #$PR"
          git -c core.hooksPath=/dev/null push -q \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/main

  # La corrida de datos que lanzó un cambio de cálculo: se la sigue hasta que
  # termina y, si no sale bien, se avisa en el hilo del cambio.
  seguir-corrida:
    needs: publicar
    if: ${{ !cancelled() && needs.publicar.outputs.metodo == 'si' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CANAL_ALERTAS: ${{ secrets.SLACK_CANAL_ALERTAS }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aviso
          path: aviso
      - name: Esperar la corrida y avisar si falla
        run: |
          [ -s aviso/aviso.py ] || exit 0
          desde="${{ needs.publicar.outputs.despacho }}"
          id=""
          for i in $(seq 1 20); do
            id=$(gh run list --repo "${{ github.repository }}" --workflow data-pipeline.yml --event workflow_dispatch \
              --limit 5 --json databaseId,createdAt --jq "[.[]|select(.createdAt >= \"$desde\")]|last|.databaseId // empty")
            [ -n "$id" ] && break
            sleep 15
          done
          if [ -z "$id" ]; then
            python3 aviso/aviso.py corrida --pr "$PR" --datos-pr aviso/pr.json --hilo "${{ needs.publicar.outputs.hilo }}" \
              --conclusion "no arrancó" --corrida-url "${{ github.server_url }}/${{ github.repository }}/actions/workflows/data-pipeline.yml"
            exit 0
          fi
          gh run watch "$id" --repo "${{ github.repository }}" > /dev/null 2>&1 || true
          conclusion=$(gh run view "$id" --repo "${{ github.repository }}" --json conclusion --jq .conclusion)
          python3 aviso/aviso.py corrida --pr "$PR" --datos-pr aviso/pr.json --hilo "${{ needs.publicar.outputs.hilo }}" \
            --conclusion "$conclusion" --corrida-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/$id"
