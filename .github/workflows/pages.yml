name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/informe_coyuntura/web/package-lock.json
      - name: Build informe (Astro)
        working-directory: projects/informe_coyuntura/web
        run: |
          npm ci
          npm run build
      - name: Publicar Votómetro en la carpeta de deploy
        run: cp projects/votometro/web/votometro.html web/votometro.html
      # informe.cigob.org: segundo build con base "/" → repo dedicado cigob-informe
      - name: Build informe para el dominio
        working-directory: projects/informe_coyuntura/web
        env:
          DEPLOY_TARGET: dominio
        run: npm run build
      - name: Publicar al repo del dominio (cigob-informe)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.CIGOB_INFORME_DEPLOY_KEY }}
          external_repository: Juanpintoselso33/cigob-informe
          publish_branch: gh-pages
          publish_dir: web-dominio
          cname: informe.cigob.org
      # El builder legacy de Pages se cuelga en "building"/"errored" tras el
      # push de peaceiris (visto repetidamente el 03-jul-2026; el POST a la API
      # /pages/builds NO lo destraba). Un commit trivial sobre gh-pages dispara
      # un build fresco que sí completa. Incondicional e inofensivo: si el
      # build original salió bien, el nuevo re-publica el mismo contenido.
      - name: Destrabar el build de Pages del dominio (workaround)
        run: |
          sleep 45
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.CIGOB_INFORME_DEPLOY_KEY }}"
          git clone --depth 1 --branch gh-pages git@github.com:Juanpintoselso33/cigob-informe.git /tmp/pages-retrigger
          cd /tmp/pages-retrigger
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%s > .pages-retrigger
          git add .pages-retrigger
          git commit -m "chore: retrigger pages build (workaround builder colgado)"
          git push origin gh-pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
