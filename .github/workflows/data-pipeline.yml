name: Daily data pipeline

# Corre el pipeline completo de los 4 cinturones del Informe de Coyuntura una
# vez al día y commitea el snapshot a main. El deploy de la web (Vercel) lo
# dispara Vercel solo, vía su integración de GitHub, en cuanto ve el push.
#
# 00:00 hora de Buenos Aires (UTC-3) = 03:00 UTC. Argentina no aplica horario
# de verano, así que el offset es fijo todo el año.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write   # commitear el snapshot + caches de vuelta a main
  issues: write     # abrir/actualizar el issue de aviso cuando la corrida falla

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # cota dura: pytrends/scrapers pueden colgar en rate-limit.
                          # 20 quedó al ras (corridas reales de 19m32s/20m2s) y el
                          # probeo terminal de id_maximo de Diputados (margen de
                          # huecos 450, una vez por día vía store) suma ~2-3 min.
                          # 30 también quedó al ras, y de la peor manera: estaba
                          # calibrado contra corridas que MORÍAN en el gate a los
                          # 27 min (1-4 de agosto, veto_quorum). Con el gate
                          # pasando hay que sumarle tests + commit, y la corrida
                          # del 5-ago se comió los 30 min completos con las series
                          # todavía a medio bajar (Trends rate-limiteando con
                          # backoff desde 01:20). El techo no lo pone una fuente
                          # colgada sino la suma real: colectores ~14 min +
                          # descargar_series ~16 min + gate/tests/commit ~3 min.
    defaults:
      run:
        working-directory: projects/informe_coyuntura
    steps:
      - uses: actions/checkout@v6
        with:
          # Historia COMPLETA, no el clon shallow por defecto. `bigquery_backfill`
          # reconstruye corridas viejas leyendo el snapshot commit por commit
          # (ADR-0209), y su test verifica ese supuesto contando las corridas que
          # hay en git. Con `fetch-depth: 1` encuentra una sola y falla — el
          # nocturno se cayó cuatro noches seguidas por eso, sin que ningún dato
          # estuviera mal. El repo pesa 16 MB y 913 commits: traer todo no cuesta.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/informe_coyuntura/requirements.txt

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/informe_coyuntura/web/package-lock.json

      # Los colectores devuelven exit 1 (mezcla fresco/cache) o 2 (fallo total de
      # fuente) de forma esperada: con los caches versionados eso degrada al
      # último valor conocido, no debe abortar el pipeline. Solo publicar.py es
      # bloqueante — si no produjo snapshot, el job falla y NO se deploya nada,
      # dejando la web anterior en pie.
      - name: Correr colectores
        env:
          BA_TRANSPORTE_CLIENT_ID: ${{ secrets.BA_TRANSPORTE_CLIENT_ID }}
          BA_TRANSPORTE_CLIENT_SECRET: ${{ secrets.BA_TRANSPORTE_CLIENT_SECRET }}
          PRESUPUESTO_ABIERTO_TOKEN: ${{ secrets.PRESUPUESTO_ABIERTO_TOKEN }}
          ACLED_USERNAME: ${{ secrets.ACLED_USERNAME }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          ACLED_UBA_USERNAME: ${{ secrets.ACLED_UBA_USERNAME }}
          ACLED_UBA_PASSWORD: ${{ secrets.ACLED_UBA_PASSWORD }}
        run: |
          set +e
          # Se duplica la salida a un archivo para que el aviso a Slack pueda
          # clasificarla después. Sin esto habría que volver a pedir el log por
          # API, que es más frágil y llega tarde.
          exec > >(tee -a "$RUNNER_TEMP/colectores.log") 2>&1
          # Los colectores usan sus exit codes como DATO, no como error:
          #   0 = todo fresco · 1 = mixto fresco/caché · 2 = todo caché
          # Una fuente caída es normal y no debe cortar la corrida.
          #
          # Pero un código >2 NO es una condición de datos: es un crash del
          # script (ADR-0133). Pasó el 26-jul-2026 con un ModuleNotFoundError
          # de pypdf: el colector reventaba, la serie quedaba vacía y la falla
          # aparecía TRES PASOS DESPUÉS como una discrepancia de matriz
          # incomprensible. Se distingue una cosa de la otra y se avisa fuerte.
          # Tercer argumento: presupuesto de tiempo del script (ADR-0173). Una
          # fuente LENTA no tenía ninguna defensa: se comía el presupuesto del
          # job entero y dejaba sin correr al gate, los tests y el commit. El
          # 5-ago-2026 dos corridas murieron así con Trends haciendo backoff.
          # Agotarlo es una condición de FUENTE, no un crash: se mapea a 2
          # ("todo caché"), que es el código que el pipeline ya sabe leer.
          #
          # descargar_series.py va con presupuesto holgado A PROPÓSITO: escribe
          # un CSV por cinturón a medida que los termina, así que matarlo desde
          # afuera deja unos frescos y otros de ayer (el falso G3 de CLAUDE.md).
          # Su defensa real es el presupuesto POR INDICADOR que tiene adentro;
          # esto es sólo el último recurso.
          crashes=0
          correr() {
            timeout --signal=TERM --kill-after=60s "${3:-10m}" python "$1"; local c=$?
            if [ $c -eq 124 ] || [ $c -eq 137 ]; then
              echo "::warning::$2 agotó su presupuesto de ${3:-10m} — se sigue con caché"
              c=2
            fi
            echo "::notice::$2 exit=$c"
            if [ $c -gt 2 ]; then
              echo "::error::$2 CRASHEÓ (exit $c) — no es una fuente caída, es el script"
              crashes=$((crashes+1))
            fi
          }
          correr scripts/macro.py               macro       8m
          correr scripts/politica.py            politica    10m
          correr scripts/gestion.py             gestion     12m
          correr scripts/vida_cotidiana/main.py vida_main   8m
          correr scripts/vida_cotidiana.py      vida_cache  5m
          correr scripts/descargar_series.py    series      25m
          correr scripts/validacion_externa.py  validacion  5m
          correr scripts/generar_informe.py     generar     5m
          if [ $crashes -gt 0 ]; then
            echo "::error::$crashes script(s) crashearon. Se corta acá para que la"
            echo "::error::causa quede a la vista y no se publique un snapshot mutilado."
            exit 1
          fi
          true

      - name: Generar snapshot web
        run: python scripts/publicar.py

      - name: Regenerar sensibilidad ampliada
        run: python scripts/sensibilidad.py

      # Gates de calidad. Desde ADR-0133 el gate distingue:
      #   * INTEGRIDAD (G1 campos faltantes · G3 card≠serie · G6 jerga interna)
      #     → corta. El snapshot afirmaría algo que no es cierto.
      #   * DEMORA (G2 una fuente atrasada) → NO corta. Dejar todo el informe
      #     sin actualizar porque un organismo publica lento es peor que
      #     publicar el último dato que ese organismo llegó a sacar.
      #     OJO (ADR-0227): "demorada" NO quiere decir "desactualizada". El
      #     flag `desactualizado` lo escribe el colector cuando el fetch falla
      #     y sirve caché; una card demorada con el fetch sano lo tiene en
      #     false, y está bien. El gate sólo LEE el snapshot y corre después
      #     de publicar.py: no marca nada.
      - name: Gate de calidad del snapshot (G1-G3, G6)
        run: python scripts/gate_calidad.py

      - name: Tests de reconciliación y robustez (G4-G5)
        run: python -m pytest tests -q

      # El Monitor en #informe-de-coyuntura: un mensaje fijo que se actualiza en
      # su lugar (chat.update NO notifica) y uno nuevo SÓLO si algo se movió de
      # verdad. Ese canal tuvo 8 mensajes humanos en 60 días: un resumen diario
      # lo convertiría en un feed con el bot hablando el 88% del tiempo.
      #
      # Va ANTES de commitear, no después: `output/estado_slack.json` guarda el
      # ts del mensaje fijo y el estado anterior, y tiene que entrar en el
      # commit de ESTA corrida. Si quedara afuera, el runner arrancaría cada
      # noche sin el ts y publicaría un mensaje nuevo en vez de editar el que ya
      # está — que es exactamente el feed diario que no queremos.
      #
      # El snapshot ya pasó el gate y los tests acá: lo único que viene después
      # es el commit, y si ese falla salta el aviso de falla igual.
      - name: Avisar el Monitor en Slack
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CANAL_INFORME: ${{ secrets.SLACK_CANAL_INFORME }}
        run: python scripts/aviso_informe.py

      - name: Commitear snapshot + caches a main
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/informe_coyuntura/output/cache/*.json \
                  projects/informe_coyuntura/output/estado_slack.json \
                  projects/informe_coyuntura/output/series/*.csv \
                  projects/informe_coyuntura/output/sensibilidad.json \
                  projects/informe_coyuntura/output/informe.json \
                  projects/informe_coyuntura/output/informe.md \
                  projects/informe_coyuntura/output/validacion_externa.json \
                  projects/informe_coyuntura/web/src/data/informe.json \
                  projects/informe_coyuntura/web/src/data/series.json \
                  projects/informe_coyuntura/data/historico/indicadores.json \
                  projects/informe_coyuntura/scripts/vida_cotidiana/data/vida_cotidiana_*.json \
                  projects/informe_coyuntura/data/macro/patentamientos_comerciales.json \
                  projects/informe_coyuntura/data/macro/comarb_recaudacion.json \
                  projects/informe_coyuntura/data/gestion/rigi_fechas.json \
                  projects/informe_coyuntura/data/gestion/piquetes_alertas.json \
                  projects/informe_coyuntura/data/gestion/tdps_baseline_2023.json \
                  projects/informe_coyuntura/data/gestion/protestas_caba.json \
                  projects/informe_coyuntura/data/gestion/concesiones_fechas.json \
                  projects/informe_coyuntura/data/gestion/acled_cortes.json \
                  projects/informe_coyuntura/data/gestion/desregulacion_normas.json \
                  projects/informe_coyuntura/data/gestion/desregulacion_oficial.json \
                  projects/informe_coyuntura/data/gestion/privatizaciones_novedades.json \
                  projects/informe_coyuntura/data/gestion/fal_hitos.json \
                  projects/informe_coyuntura/data/politica/csjn_novedades.json \
                  projects/informe_coyuntura/data/politica/apoyo_empresario_novedades.json \
                  projects/informe_coyuntura/data/vida/carne_serie.json \
                  projects/informe_coyuntura/data/vida/carnes_total_serie.json \
                  projects/informe_coyuntura/data/vida/sentimiento_serie.json \
                  projects/informe_coyuntura/data/vida/ivi_serie.json \
                  projects/informe_coyuntura/data/vida/snic_serie.json \
                  projects/informe_coyuntura/data/vida/intencion_migratoria_serie.json \
                  projects/informe_coyuntura/data/vida/componente_b_migracion.json \
                  projects/informe_coyuntura/data/politica/alineamiento_senadores_actas.json \
                  projects/informe_coyuntura/data/politica/derrotas_legislativas_eventos.json \
                  projects/informe_coyuntura/data/politica/cohesion_bloque_senado_actas.json \
                  projects/informe_coyuntura/data/politica/cohesion_bloque_diputados_actas.json \
                  projects/informe_coyuntura/data/politica/cohesion_bloque_diputados_actas_cache.json \
                  projects/informe_coyuntura/data/politica/id_maximo_diputados.json \
                  projects/informe_coyuntura/data/politica/gabinete_salidas.json \
                  projects/informe_coyuntura/data/politica/gabinete_decretos_cache.json \
                  projects/informe_coyuntura/data/politica/cohesion_bloque_serie.json \
                  projects/informe_coyuntura/data/politica/cohesion_bloque_senado_serie.json \
                  projects/informe_coyuntura/data/politica/alineamiento_senadores_serie.json \
                  projects/informe_coyuntura/data/vida/pobreza_nowcast_serie.json
          if git diff --staged --quiet; then
            echo "::notice::Sin cambios en datos — no se commitea."
          else
            git commit -m "data(informe): actualización diaria automática"
            # Rebase y reintento: la corrida dura ~30 min y cualquier push a
            # main en esa ventana rechaza el nuestro por no-fast-forward. Pasó
            # el 5-ago-2026: colectores, gate y tests en verde, todo el trabajo
            # hecho, y el snapshot se perdió en la última línea por un push de
            # otra cosa. CLAUDE.md ya le exige `git pull --rebase` a las
            # personas; el workflow no se lo exigía a sí mismo.
            empujado=0
            for intento in 1 2 3; do
              if git push; then empujado=1; break; fi
              echo "::warning::push rechazado (intento $intento) — rebase y reintento"
              git pull --rebase --autostash || break
              sleep $((intento * 5))
            done
            if [ "$empujado" != "1" ]; then
              echo "::error::No se pudo publicar el snapshot tras 3 intentos."
              exit 1
            fi
          fi

      # ── Archivo histórico en BigQuery (ADR-0180) ──────────────────────────
      # Va DESPUÉS de los gates y del commit: a BigQuery sólo llega lo que ya
      # se publicó. El sentido inverso no existe — el pipeline nunca lee de
      # BigQuery, para que no pueda volverse un camino que esquive G1-G7.
      #
      # La corrida salió bien, pero puede haber publicado con datos degradados
      # que no esperábamos. El script calla lo conocido (SAIJ bloquea a los
      # runners por IP y eso ya está decidido) y sólo habla de lo que no
      # entiende: una fuente caída entera, un presupuesto agotado, o un error
      # que NO es de red — esa última clase es la que se disfraza de "fuente
      # caída" y congela una serie, como pasó con icg_utdt durante cuatro días.
      - name: Avisar degradaciones inesperadas
        if: success()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CANAL_ALERTAS: ${{ secrets.SLACK_CANAL_ALERTAS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/aviso_slack.py degradado --log "$RUNNER_TEMP/colectores.log"

      # `continue-on-error` es deliberado, mismo criterio que el aviso de falla:
      # publicar el informe es el camino crítico. Si BigQuery está caído o la
      # credencial venció, se pierde una corrida del archivo, no la publicación.
      - name: Espejar la corrida en BigQuery
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::warning::Sin GCP_SA_KEY — se omite el espejo en BigQuery."
            exit 0
          fi
          # El runner es efímero, pero igual fuera del árbol de trabajo para
          # que ningún `git add` posterior pueda alcanzar la clave.
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa.json"
          python scripts/bigquery_export.py
          rm -f "$RUNNER_TEMP/gcp-sa.json"

      # ── Aviso de falla ────────────────────────────────────────────────────
      # El pipeline estuvo cortado del 1 al 4 de agosto de 2026 —cuatro noches
      # seguidas, siempre la misma falla de G3— y nadie se enteró: el workflow
      # no tenía un solo `if: failure()`. Lo detectó una persona preguntando por
      # qué la web mostraba datos viejos, cuatro días después. Del 21 al 26 de
      # julio había pasado lo mismo: seis noches.
      #
      # `continue-on-error` es deliberado: el aviso NUNCA puede cambiar el
      # resultado del job ni tapar la falla real. Si GitHub no deja abrir el
      # issue, se pierde el aviso, no el diagnóstico.
      - name: Avisar que la corrida falló
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CANAL_ALERTAS: ${{ secrets.SLACK_CANAL_ALERTAS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Los pasos ya corridos tienen conclusión aunque el job siga abierto,
          # así que se puede nombrar el culpable en el aviso mismo. Sin esto el
          # issue diría sólo "falló" y habría que entrar a leer el log igual.
          pasos=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                    --jq '.jobs[].steps[] | select(.conclusion=="failure") | "- " + .name' 2>/dev/null || true)
          [ -z "$pasos" ] && pasos="- (no se pudo determinar el paso)"
          # printf y no un string multilínea: dentro del bloque YAML las líneas
          # de continuación arrastran la indentación y markdown las renderiza
          # como bloque de código.
          cuerpo=$(printf 'La corrida del %s falló.\n\n**Pasos que fallaron:**\n%s\n\n%s\n\nEl snapshot **no se publicó**: producción sigue sirviendo el anterior.\nEste issue se cierra solo cuando una corrida vuelva a terminar bien.\n' \
                     "$(date -u '+%Y-%m-%d %H:%M UTC')" "$pasos" "$RUN_URL")
          gh label create pipeline-caido --color B60205 \
            --description "El pipeline nocturno terminó en falla" 2>/dev/null || true
          n=$(gh issue list --state open --label pipeline-caido --limit 1 \
                --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$cuerpo"
          else
            gh issue create --title "El pipeline nocturno está fallando" \
              --label pipeline-caido --body "$cuerpo"
          fi
          # El issue es el registro; Slack es la notificación. Sin esto el
          # aviso se abre y se cierra a las 3 de la mañana sin que nadie lo
          # vea: pasó del 22 al 24-ago-2026, tres noches, con la web sirviendo
          # datos del 21.
          python scripts/aviso_slack.py fallo --pasos "$pasos" || true

      # El aviso se apaga solo. Un issue que hay que cerrar a mano se vuelve
      # ruido y deja de leerse, que es la forma lenta de volver al silencio.
      - name: Cerrar el aviso si la corrida salió bien
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CANAL_ALERTAS: ${{ secrets.SLACK_CANAL_ALERTAS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # El aviso de recuperación va DENTRO del loop a propósito: si no
          # había issue abierto, no hubo falla, y un "todo bien" diario es
          # justo lo que entrena a la gente a ignorar el canal.
          for n in $(gh issue list --state open --label pipeline-caido \
                       --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Resuelto: la corrida terminó bien y publicó. $RUN_URL"
            python scripts/aviso_slack.py recuperado || true
          done
