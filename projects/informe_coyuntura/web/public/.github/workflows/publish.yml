# Publicación de Pages via Actions (bypass del builder legacy de GitHub, que
# se colgó repetidamente el 03-jul-2026). Este archivo viaja DENTRO del
# publish_dir del deploy (web/public/.github/...), así cada push de peaceiris
# lo conserva. El deploy real lo hace actions/deploy-pages: sin Jekyll, sin
# builder interno.
name: Publish Pages
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
